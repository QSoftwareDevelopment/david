<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David — hotel concierge console</title>
<meta name="description" content="Staff console for David, the hotel concierge that sits on top of Opera. Sample data.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4A3F'/%3E%3Ctext x='16' y='23' font-size='20' font-family='Georgia' text-anchor='middle' fill='white'%3ED%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><b>David</b><span class="small" id="hotel"></span></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <button class="sidefoot" id="reset" title="Clear your changes and start again">Reset demo data</button>
    <div class="me"><span class="avatar">MR</span><div><div>Maya Reyes</div><div class="small">Duty manager</div></div></div>
  </aside>
  <main class="main">
    <header class="top">
      <div class="t"><h1 id="title"></h1><span class="small" id="sub"></span></div>
      <div class="r">
        <button class="search" id="openSearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search guests, rooms, requests</span><kbd>⌘K</kbd></button>
        <span class="live"><i></i>Opera stream live</span>
        <button class="icon-btn" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>
<div class="palette" id="palette" hidden>
  <div class="box" role="dialog" aria-label="Search">
    <input id="pq" placeholder="Search pages, guests and requests" autocomplete="off">
    <ul id="pl"></ul>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Editor"></aside>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
